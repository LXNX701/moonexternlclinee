name: Build Moon Place IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Theos with dm.pl
      run: |
        git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        export THEOS=$HOME/theos
        curl -L https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl -o $THEOS/bin/dm.pl
        chmod +x $THEOS/bin/dm.pl
        brew install ldid xz || true
        rm -rf $THEOS/sdks
        git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
        $THEOS/bin/update-theos

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Configure Firebase (optional)
      id: firebase
      env:
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      run: |
        if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ] || [ "$GOOGLE_SERVICE_INFO_PLIST" = "" ]; then
          echo "Firebase not configured - skipping"
          echo "firebase_configured=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ThreeOneOSFive/GoogleService-Info.plist 2>/dev/null && echo "Firebase configured" && echo "firebase_configured=true" >> $GITHUB_OUTPUT || echo "Firebase config failed - continuing without it" && echo "firebase_configured=false" >> $GITHUB_OUTPUT

    - name: Build IPA with Theos
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1
        find . -name "*.ipa" -type f -exec cp {} /Users/runner/work/moonexternlclinee/moonexternlclinee/MoonPlace.ipa \;

    - name: Upload IPA artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MoonPlace-IPA
        path: MoonPlace.ipa
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Moon Place Build ${{ github.run_number }}
        body: |
          ## Moon Place - Build ${{ github.run_number }}

          ### Features
          - Firebase Authentication
          - Moon Place UI (Dark/Premium theme)
          - V1F and V2FX modes
          - Patch system with Apply/Restore
          - Kernel exploit support
          - File browser

          ### Installation
          1. Download the IPA
          2. Sign with your preferred tool (AltStore, SideStore, etc.)
          3. Install on your iOS device

          ### Requirements
          - iOS 15.0+
          - Compatible device (check exploit compatibility)
        files: MoonPlace.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
