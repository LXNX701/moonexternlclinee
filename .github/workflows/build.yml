name: Build Moon Place IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Configure Firebase (optional)
      continue-on-error: true
      env:
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      run: |
        if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ] || [ "$GOOGLE_SERVICE_INFO_PLIST" = "" ]; then
          echo "Firebase not configured - skipping"
          exit 0
        fi
        echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ThreeOneOSFive/GoogleService-Info.plist 2>/dev/null && echo "Firebase configured" || echo "Firebase config failed - continuing"

    - name: Build with Xcode
      run: |
        cd ThreeOneOSFive
        xcodebuild -project ../ThreeOneOSFive.xcodeproj -scheme ThreeOneOSFive -configuration Release -destination generic/platform=iOS -derivedDataPath build build

    - name: Package IPA
      run: |
        APP_PATH=$(find ThreeOneOSFive/build -name "*.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MoonPlace.ipa Payload/
          echo "IPA created successfully"
          ls -la MoonPlace.ipa
        else
          echo "Error: .app not found"
          find ThreeOneOSFive/build -type d -name "*.app" 2>/dev/null || echo "No .app directories found"
          exit 1
        fi

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoonPlace-IPA
        path: MoonPlace.ipa
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Moon Place Build ${{ github.run_number }}
        body: |
          ## Moon Place - Build ${{ github.run_number }}
          
          ### Features
          - Firebase Authentication
          - Moon Place UI (Dark/Premium theme)
          - V1F and V2FX modes
          - Patch system with Apply/Restore
          - Kernel exploit support
          - File browser
          
          ### Installation
          1. Download the IPA
          2. Sign with your preferred tool (AltStore, SideStore, etc.)
          3. Install on your iOS device
          
          ### Requirements
          - iOS 15.0+
          - Compatible device (check exploit compatibility)
        files: MoonPlace.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}